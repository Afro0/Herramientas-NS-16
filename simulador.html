<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Cabina Metro NS-16</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: #ffffff; overflow-x: hidden; padding: 10px;
        }
        .cabina-wrapper {
            position: relative; width: 100vw; max-width: 1400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); border-radius: 8px; overflow: hidden;
            background: #000; margin: 0 auto;
        }
        .vista-container { display: none; position: relative; width: 100%; height: auto; }
        .vista-container.activa { display: block; }
        .cabina-img { width: 100%; height: auto; display: block; object-fit: contain; }
        area { cursor: pointer; }

        .top-bar { position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 20; }
        .nav-bar { position: absolute; top: 15px; left: 420px; display: flex; gap: 8px; z-index: 20; }
        .ext-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 20; background: rgba(0,0,0,0.85);
            padding: 8px 12px; border-radius: 8px; border: 1px solid #ffcc00;
        }

        .btn-ui {
            padding: 8px 14px; font-size: 12px; font-weight: bold; border: none;
            border-radius: 5px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s; text-decoration: none; display: inline-block;
        }
        .btn-ui:active { transform: scale(0.95); }
        .btn-nav { background-color: #34495e; color: white; border: 1px solid #5d6d7e; }
        .btn-nav.activo { background-color: #f39c12; color: black; border-color: #f1c40f; }
        .btn-menu { background-color: #8e44ad; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-finish { background-color: #2ecc71; color: white; }
        .btn-ext { background-color: #3498db; color: white; }

        .panel-pantalla {
            position: absolute; top: 15px; left: 20px; background: rgba(10, 12, 18, 0.94);
            border: 2px solid #ffcc00; padding: 12px 16px; border-radius: 6px; width: 380px;
            z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .panel-pantalla h2 { color: #ffcc00; font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
        .panel-pantalla p { font-size: 12px; color: #dddddd; line-height: 1.35; white-space: pre-line; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #181a20; padding: 20px; border-radius: 8px; border: 1px solid #ffcc00;
            text-align: center; min-width: 320px; max-width: 480px;
        }
        .modal-content h4 { margin-bottom: 12px; color: #ffcc00; }
        .modal-options { display: flex; flex-direction: column; gap: 8px; }
        .btn-opt {
            padding: 9px; background: #252830; color: white; border: 1px solid #444;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .btn-opt:hover { background: #00ffcc; color: #000; }
        .llave-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
</head>
<body>

    <div class="cabina-wrapper">
        <div class="panel-pantalla">
            <h2 id="info-titulo">Cargando Nivel...</h2>
            <p id="info-desc">Inicializando protocolo operativo...</p>
        </div>

        <div class="nav-bar">
            <button id="btn-vista-pupitre" class="btn-ui btn-nav activo" onclick="cambiarVista('pupitre')">Pupitre Principal</button>
            <button id="btn-vista-bt3" class="btn-ui btn-nav" onclick="cambiarVista('bt3')">Armario BT3</button>
        </div>

        <div class="top-bar">
            <a href="menu_simulador.html" class="btn-ui btn-menu">Cambiar Nivel</a>
            <button class="btn-ui btn-reset" onclick="resetearSimulador()">Resetear</button>
            <button class="btn-ui btn-finish" onclick="evaluarProcedimiento()">Terminar</button>
        </div>

        <div class="ext-bar" id="ext-bar">
            <button class="btn-ui btn-ext" onclick="accionExterior('VERIFICAR_ENTORNO')">Mirar Entorno / Vías</button>
            <button class="btn-ui btn-ext" onclick="accionExterior('INSPECCION_SALON')">Inspeccionar Salón / Puertas</button>
            <button class="btn-ui btn-ext" onclick="abrirModalLlaves()">Llaves Aislamiento (XFR/XFI/XFP)</button>
            <button class="btn-ui btn-ext" style="background-color:#e67e22;" onclick="accionEvacuacion()">Desplegar Escala Evacuación</button>
        </div>

        <!-- VISTA PUPITRE CON LÓGICA Y NOMENCLATURA EXACTA METRO -->
        <div id="vista-pupitre" class="vista-container activa">
            <img src="cabina.jpg" usemap="#mapa-pupitre" class="cabina-img" alt="Cabina NS-16">
            <map name="mapa-pupitre">
                <area target="" alt="FG" title="Cierre Puertas Izquierdas (FG)" href="javascript:accionBoton('FG')" coords="569,1279,23" shape="circle">
                <area target="" alt="FD" title="Cierre Puertas Derechas (FD)" href="javascript:accionBoton('FD')" coords="2304,1301,21" shape="circle">
                <area target="" alt="EN" title="Energización (EN)" href="javascript:accionBoton('EN')" coords="2349,1223,25" shape="circle">
                <area target="" alt="HS" title="Des-preparación / Abonado (HS)" href="javascript:accionBoton('HS')" coords="2257,1218,26" shape="circle">
                <area target="" alt="MANIPULADOR" title="Manipulador de Conducción" href="javascript:abrirSelector('MANIPULADOR', ['TRACCIÓN', 'NEUTRO', 'FRENO', 'FU'])" coords="2001,1234,1879,1150" shape="rect">
                <area target="" alt="PACIS" title="PACIS" href="javascript:interactuarPACIS()" coords="2028,903,2294,1094" shape="rect">
                <area target="" alt="DDU" title="Pantalla DDU" href="javascript:interactuarDDU()" coords="1581,840,1839,1049" shape="rect">
                <area target="" alt="AP FI" title="Anulación Freno Inmovilización (AP FI)" href="javascript:accionBoton('AP FI')" coords="1586,1126,23" shape="circle">
                <area target="" alt="DAP FI" title="Des-anulación Freno Inmovilización (DAP FI)" href="javascript:accionBoton('DAP FI')" coords="1638,1128,22" shape="circle">
                <area target="" alt="PTT" title="PTT (Megafonía Salón)" href="javascript:interactuarPACIS()" coords="1459,1129,20" shape="circle">
                <area target="" alt="LMFS" title="Lámparas Azules Enclavamiento Puertas (LMFS)" href="javascript:accionBoton('LMFS')" coords="1327,844,48" shape="circle">
                <area target="" alt="KLVR" title="Inversor de Marcha (KLVR)" href="javascript:abrirSelector('KLVR', ['ADELANTE', 'NEUTRO', 'ATRÁS'])" coords="1158,981,1208,1088" shape="rect">
                <area target="" alt="MICROFONO TETRA" title="Micrófono TETRA (PCC)" href="javascript:abrirOpcionesTETRA()" coords="1026,1073,1148,1208" shape="rect">
                <area target="" alt="KFU" title="Conmutador Freno Urgencia (KFU)" href="javascript:abrirSelector('KFU', ['NORMAL', 'EMERGENCIA'])" coords="785,1280,48" shape="circle">
                <area target="" alt="SC" title="Selector Modo Conducción (SC)" href="javascript:abrirSelector('SC', ['PA', 'CMC', 'CM', 'FS'])" coords="402,1141,528,1260" shape="rect">
                <area target="" alt="ST" title="Selector Sentido (ST)" href="javascript:abrirSelector('ST', ['I', 'AUTO', 'D', 'N'])" coords="786,1126,915,1218" shape="rect">
                <area target="" alt="KLOAN" title="Comando Apertura Puertas (KLOAN)" href="javascript:abrirSelector('KLOAN', ['APAGADO', 'ACCIONADO'])" coords="1216,1112,1266,1214" shape="rect">
                <area target="" alt="MAV" title="Marcha a la Vista (MAV)" href="javascript:accionBoton('MAV')" coords="1295,1126,20" shape="circle">
                <area target="" alt="BOTON VACMA" title="Hombre Muerto (VACMA)" href="javascript:accionBoton('BOTON VACMA')" coords="1854,1192,23" shape="circle">
                <area target="" alt="K.AA.IZ" title="Autorización Puertas Izquierdas (K.AA.IZ)" href="javascript:abrirSelector('K.AA.IZ', ['BLOQUEADO', 'AUTORIZADO'])" coords="1101,844,24" shape="circle">
            </map>
        </div>

        <!-- VISTA BT3 -->
        <div id="vista-bt3" class="vista-container">
            <img src="bt3.jpg" usemap="#mapa-bt3" class="cabina-img" alt="Armario BT3">
            <map name="mapa-bt3">
                <area target="" alt="RESET SACEM" title="RESET SACEM" href="javascript:accionResetSACEM()" coords="232,451,105" shape="circle">
                <area target="" alt="K.A.D.I" title="K.A.D.I" href="javascript:abrirSelector('K.A.D.I', ['NORMAL', 'DIRECTA'])" coords="509,459,107" shape="circle">
                <area target="" alt="K.SE.TR" title="K.SE.TR" href="javascript:abrirSelector('K.SE.TR', ['NORMAL', 'EMERGENCIA'])" coords="1073,445,108" shape="circle">
                <area target="" alt="ALIMENTACION TETRA" title="ALIMENTACION TETRA" href="javascript:abrirSelector('TETRA', ['AUTO', 'FS', 'EMERGENCIA'])" coords="1368,461,113" shape="circle">
                <area target="" alt="K.IH.KSA" title="K.IH.KSA" href="javascript:abrirSelector('K.IH.KSA', ['NORMAL', 'AISLADO'])" coords="1652,455,109" shape="circle">
                <area target="" alt="K.L.P" title="K.L.P" href="javascript:abrirSelector('K.L.P', ['NORMAL', 'LIBERACIÓN'])" coords="1953,456,108" shape="circle">
                <area target="" alt="K.IS.BU.PU" title="K.IS.BU.PU" href="javascript:abrirSelector('K.IS.BU.PU', ['NORMAL', 'BYPASS'])" coords="316,1267,118" shape="circle">
                <area target="" alt="K.A.BT" title="K.A.BT" href="javascript:abrirSelector('K.A.BT', ['FS', 'NORMAL', 'DIRECTO'])" coords="710,1233,113" shape="circle">
                <area target="" alt="K.IS.ND.FR" title="K.IS.ND.FR" href="javascript:abrirSelector('K.IS.ND.FR', ['NORMAL', 'AISLADO'])" coords="1080,1247,128" shape="circle">
                <area target="" alt="K.IS.HM" title="K.IS.HM" href="javascript:abrirSelector('K.IS.HM', ['NORMAL', 'AISLADO'])" coords="384,1626,111" shape="circle">
            </map>
        </div>
    </div>

    <!-- Modal Conmutadores -->
    <div id="modalSelector" class="modal">
        <div class="modal-content">
            <h4 id="modal-titulo">Seleccionar Posición</h4>
            <div id="modal-options" class="modal-options"></div>
        </div>
    </div>

    <!-- Modal Llaves de Aislamiento -->
    <div id="modalLlaves" class="modal">
        <div class="modal-content">
            <h4>Llaves de Aislamiento de Boguies</h4>
            <div style="margin: 15px 0;">
                <div class="llave-row">
                    <span>Llave XFR (Freno Retenido/Neumático - Amarilla):</span>
                    <button id="btn-xfr" class="btn-opt" onclick="toggleLlave('XFR')">NORMAL</button>
                </div>
                <div class="llave-row">
                    <span>Llave XFI (Freno de Inmovilización - Roja):</span>
                    <button id="btn-xfi" class="btn-opt" onclick="toggleLlave('XFI')">NORMAL</button>
                </div>
                <div class="llave-row">
                    <span>Llave XFP (Frotador Positivo - Negra):</span>
                    <button id="btn-xfp" class="btn-opt" onclick="toggleLlave('XFP')">NORMAL</button>
                </div>
            </div>
            <button class="btn-ui btn-reset" onclick="cerrarModalLlaves()">Confirmar y Cerrar</button>
        </div>
    </div>

    <script>
        const estacionesL2 = ["Hospital El Pino", "La Cisterna", "Lo Ovalle", "Franklin", "Los Héroes", "Santa Ana", "Cal y Canto", "Vespucio Norte"];
        let estacionActual = "La Cisterna";
        let trenNumero = 104;
        let nivelActual = 1;

        let estadoActual = {
            SC: 'PA', ST: 'D', KLVR: 'ADELANTE', MANIPULADOR: 'NEUTRO', TETRA: 'AUTO',
            XFR: 'NORMAL', XFI: 'NORMAL', XFP: 'NORMAL', K_IH_KSA: 'NORMAL',
            comunicadoPCC: false, ayudaPCCUsada: false, entornoRevisado: false, salonRevisado: false, escalaDesplegada: false,
            puertasEnclavadas: true
        };

        let historialAcciones = [];
        let tiempoDespreparado = null;
        let elementoActualModal = '';

        const infoNiveles = {
            1: { 
                t: "1. Pruebas y Verificaciones (Preparación)", 
                d: "Toma de servicio. Debe realizar la preparación del tren y ejecutar las pruebas estáticas y dinámicas normativas." 
            },
            2: { 
                t: "2. Bloqueo de Puertas Averiada", 
                d: "DDU o pasajeros reportan falla en una puerta que no enclava. Proceda según protocolo de bloqueo." 
            },
            3: { 
                t: "3. Liberación de Puertas", 
                d: "Instrucción de evacuar tren en estación por falla mayor. Se requiere habilitar manualmente el acceso al coche." 
            },
            4: { 
                t: "4. Aislamiento de Frenado Neumático (XFR)", 
                d: "DDU indica avería de freno neumático en un boguie. PCC autoriza su aislamiento mecánico." 
            },
            5: { 
                t: "5. Aislamiento de Freno de Inmovilización (XFI)", 
                d: "Falla detectada en el Freno de Inmovilización (FI). Proceda a aislar el boguie afectado tras verificar desenergización." 
            },
            6: { 
                t: "6. Repliegue de Frotadores Positivos (XFP)", 
                d: "Anomalía en captación de corriente. Debe aislar eléctricamente el coche motriz replegando frotadores." 
            },
            7: { 
                t: "7. Reseteo del Tren (Estación / Interestación)", 
                d: "Falla temporal en bucle de tracción. Se requiere ejecutar un reseteo general del tren." 
            },
            8: { 
                t: "8. Reseteo Ordenador y Platina SACEM", 
                d: "La platina del SACEM se ha apagado totalmente o muestra bloqueo permanente. Reinicie el sistema." 
            },
            9: { 
                t: "9. Sistema KSA (Avance/Retroceso e Inhibición)", 
                d: "Alarma KSA activada por pasajero en salida de estación. Gestione la maniobra de movimiento e inhibición." 
            },
            10: { 
                t: "10. Persona Atrapada entre Puertas", 
                d: "¡Alerta! Pasajero atrapado al iniciar la marcha. Aplique las acciones inmediatas de seguridad." 
            },
            11: { 
                t: "11. Evacuación de Pasajeros en Interestación", 
                d: "Tren detenido de forma indefinida en túnel. PCC ordena evacuar pasajeros hacia la estación más cercana." 
            }
        };

        function inicializarSimulador() {
            const urlParams = new URLSearchParams(window.location.search);
            nivelActual = parseInt(urlParams.get('nivel')) || 1;
            estacionActual = estacionesL2[Math.floor(Math.random() * estacionesL2.length)];
            trenNumero = 100 + Math.floor(Math.random() * 20);

            historialAcciones = [];
            actualizarPanel(infoNiveles[nivelActual].t, `Estación ${estacionActual} - Tren ${trenNumero}\n${infoNiveles[nivelActual].d}`);
        }

        function cambiarVista(vista) {
            document.querySelectorAll('.vista-container').forEach(el => el.classList.remove('activa'));
            document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('activo'));

            if (vista === 'pupitre') {
                document.getElementById('vista-pupitre').classList.add('activa');
                document.getElementById('btn-vista-pupitre').classList.add('activo');
            } else {
                document.getElementById('vista-bt3').classList.add('activa');
                document.getElementById('btn-vista-bt3').classList.add('activo');
            }
            setTimeout(() => { imageMapResize(); }, 50);
        }

        function actualizarPanel(titulo, desc) {
            document.getElementById('info-titulo').innerText = titulo;
            document.getElementById('info-desc').innerText = desc;
        }

        function registrarAccion(accion, detalles) {
            historialAcciones.push({ accion, detalles, tiempo: Date.now() });
        }

        function abrirOpcionesTETRA() {
            elementoActualModal = 'TETRA_OPCIONES';
            document.getElementById('modal-titulo').innerText = 'Micrófono TETRA - PCC';
            let container = document.getElementById('modal-options');
            container.innerHTML = `
                <button class="btn-opt" onclick="comunicarPCC(false)">Llamada de Rutina a PCC</button>
                <button class="btn-opt" style="background:#f39c12; color:#000;" onclick="comunicarPCC(true)">[SECRETO] Consultar secuencia del procedimiento a PCC</button>
            `;
            document.getElementById('modalSelector').style.display = 'flex';
        }

        function comunicarPCC(esAyuda) {
            document.getElementById('modalSelector').style.display = 'none';
            estadoActual.comunicadoPCC = true;
            if (esAyuda) estadoActual.ayudaPCCUsada = true;

            let respuestaPCC = "";
            if (!esAyuda) {
                respuestaPCC = `📻 PCC: "Enterado conductor tren ${trenNumero} en estación ${estacionActual}. Realice procedimiento normativo."`;
            } else {
                let pautas = {
                    1: "PCC: Verifique DDU, pruebe FU, compruebe KSA y efectúe prueba de puertas en ambos lados.",
                    2: "PCC: Anuncie detención, acuda a la puerta, cierre manualmente, bloquee con llave exterior e instale cinta amarilla.",
                    3: "PCC: Inserte llave triangular en primera puerta del primer coche, gire 1/4 de vuelta horario e informe a clientes.",
                    4: "PCC: Confirme desenergización en DDU, accione ruptor y accione la llave XFR amarilla hasta despegar la zapata.",
                    5: "PCC: Confirme desenergización, accione ruptor, gire llave XFI roja (escuchará un golpe seco) y reponga ruptor.",
                    6: "PCC: Utilice paleta para empujar frotador y retire llave XFP negra 20cm fuera de posición en ambos boguies.",
                    7: "PCC: Anuncie apagado de luces, SC en CML, KLVR en neutro, presione HS, espere 10s y re-prepare con EN.",
                    8: "PCC: SC en CMC y mantenga presionado el botón rojo Reset SACEM por 5 segundos en el armario BT3.",
                    9: "PCC: K.IH.KSA en aislado, verifique puerta en DDU, traccione máx 5 km/h si retrocede y rearme con llave triangular.",
                    10: "PCC: Aplique FU inmediato, auxilie a la persona, rearme KSA en salón y confirme enclavamiento con FD/FG y LMFS.",
                    11: "PCC: Confirme desenergización, accione ruptor, libere puerta delantera, instale escala y dirija el cabeza de fila."
                };
                respuestaPCC = `📻 PCC (Soporte Técnico): "${pautas[nivelActual]}"`;
            }

            registrarAccion('COMUNICACION_PCC', { esAyuda });
            actualizarPanel("Micrófono TETRA - PCC", respuestaPCC);
        }

        function interactuarDDU() {
            let lecturasDDU = {
                1: "DDU: Tensión OK. Baterías 24V. Fl aplicados. DDU muestra tren en modo CML.",
                2: "DDU: Vista Operación muestra la segunda puerta del primer coche bloqueada (color amarillo).",
                3: "DDU: Vista Operación muestra puerta de color blanco e ícono de alarma 'Puerta Liberada' en zona permanente.",
                4: "DDU: Vista Operación indica 'FRN AIS' en boguie seleccionado (cuadrado amarillo).",
                5: "DDU: Vista Operación indica 'FI AIS' con cuadrado amarillo tras accionar XFI.",
                6: "DDU: Vista Preparación confirma ícono 'No hay Alta Tensión disponible' tras repliegue.",
                7: "DDU: Indicación de deslocalización del tren. Modos PA/CMC parpadeantes tras reseteo.",
                8: "DDU: Platina SACEM encendida tras 20 segundos con indicaciones PA y CMC parpadeantes.",
                9: "DDU: Muestra puerta afectada con KSA accionado. Ícono KSA fijo en zona permanente.",
                10: "DDU: Alarma de puerta y bloqueo de boguies. Permite bloqueo selectivo de puertas.",
                11: "DDU: Vista Preparación confirma desenergización efectiva de tramos de vía."
            };
            registrarAccion('LECTURA_DDU', {});
            actualizarPanel("Pantalla DDU", lecturasDDU[nivelActual]);
        }

        function accionExterior(tipo) {
            if (tipo === 'VERIFICAR_ENTORNO') {
                estadoActual.entornoRevisado = true;
                actualizarPanel("Entorno Exterior", "Verificación visual realizada: Vía libre de obstrucciones y señalización observada.");
            } else if (tipo === 'INSPECCION_SALON') {
                estadoActual.salonRevisado = true;
                actualizarPanel("Inspección de Salón", "Pasillos y puertas revisados. Cinta de fuera de servicio instalada si corresponde.");
            }
            registrarAccion('ACCION_EXTERIOR', { tipo });
        }

        function abrirModalLlaves() { document.getElementById('modalLlaves').style.display = 'flex'; }
        function cerrarModalLlaves() { document.getElementById('modalLlaves').style.display = 'none'; }

        function toggleLlave(llave) {
            estadoActual[llave] = estadoActual[llave] === 'NORMAL' ? 'AISLADO' : 'NORMAL';
            let btn = document.getElementById(`btn-${llave.toLowerCase()}`);
            btn.innerText = estadoActual[llave];
            btn.style.background = estadoActual[llave] === 'AISLADO' ? '#e74c3c' : '#252830';
            registrarAccion('CAMBIO_LLAVE', { llave, estado: estadoActual[llave] });
        }

        function accionEvacuacion() {
            estadoActual.escalaDesplegada = true;
            registrarAccion('DESPLIEGUE_ESCALA', {});
            actualizarPanel("Escala de Socorro", "Escala desplegada e instalada al centro de la puerta liberada para descenso de pasajeros.");
        }

        function abrirSelector(elemento, opciones) {
            elementoActualModal = elemento;
            document.getElementById('modal-titulo').innerText = `${elemento} (Actual: ${estadoActual[elemento] || 'NORMAL'})`;
            let container = document.getElementById('modal-options');
            container.innerHTML = '';
            opciones.forEach(opc => {
                let btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.innerText = opc;
                btn.onclick = () => seleccionarOpcion(opcion);
            });
            document.getElementById('modalSelector').style.display = 'flex';
        }

        function seleccionarOpcion(opcion) {
            document.getElementById('modalSelector').style.display = 'none';
            estadoActual[elementoActualModal] = opcion;
            registrarAccion('CAMBIO_MANDO', { elemento: elementoActualModal, posicion: opcion });
            actualizarPanel(`Mando ${elementoActualModal}`, `Posición actual: ${opcion}`);
        }

        function interactuarPACIS() {
            actualizarPanel("Terminal PACIS / PTT Salón", "PACIS NS-16: Sistema de anuncios a pasajeros e interfonos activo. Mensaje emitido al salón.");
        }

        function accionResetSACEM() {
            registrarAccion('RESET_SACEM', {});
            actualizarPanel("Armario BT3", "Pulsador 61S02 presionado por 5s. Reiniciando platina SACEM...");
        }

        function accionBoton(tipo) {
            if (tipo === 'HS') {
                estadoActual.preparado = false;
                tiempoDespreparado = Date.now();
                registrarAccion('PRESIONAR_HS', {});
                actualizarPanel("Pulsador HS", "Tren DESPREPARADO.");
            } else if (tipo === 'EN') {
                let espera = tiempoDespreparado ? (Date.now() - tiempoDespreparado) / 1000 : 0;
                estadoActual.preparado = true;
                registrarAccion('PRESIONAR_EN', { tiempoEspera: espera });
                actualizarPanel("Pulsador EN", `Tren PREPARADO. Tiempo transcurrido: ${espera.toFixed(1)}s.`);
            } else if (tipo === 'FG') {
                registrarAccion('PRESIONAR_FG', {});
                actualizarPanel("Pulsador FG", "Comando de cierre emitido a puertas izquierdas.");
            } else if (tipo === 'FD') {
                registrarAccion('PRESIONAR_FD', {});
                actualizarPanel("Pulsador FD", "Comando de cierre emitido a puertas derechas.");
            } else if (tipo === 'LMFS') {
                let est = estadoActual.puertasEnclavadas ? "ENCENDIDAS (Azules - Puertas cerradas y enclavadas)." : "APAGADAS (Bucle Abierto / Falla de enclavamiento).";
                actualizarPanel("Lámparas LMFS", `Lámparas Azules de Enclavamiento: ${est}`);
            } else if (tipo === 'MAV') {
                registrarAccion('PRESIONAR_MAV', {});
                actualizarPanel("Pulsador MAV", "Marcha a la Vista habilitada. Conducción manual protegida en curso.");
            } else if (tipo === 'BOTON VACMA') {
                registrarAccion('PRESIONAR_VACMA', {});
                actualizarPanel("Hombre Muerto (VACMA)", "Pulsador de pedal/volante presionado. Vigilancia activa.");
            } else if (tipo === 'AP FI') {
                registrarAccion('PRESIONAR_AP_FI', {});
                actualizarPanel("Anulación FI", "Comando de anulación del Freno de Inmovilización ejecutado.");
            } else if (tipo === 'DAP FI') {
                registrarAccion('PRESIONAR_DAP_FI', {});
                actualizarPanel("Des-anulación FI", "Des-anulación del Freno de Inmovilización ejecutada.");
            } else {
                registrarAccion('ACCION_BOTON', { tipo });
                actualizarPanel("Acción Registrada", `Elemento ${tipo} activado.`);
            }
        }

        function resetearSimulador() { inicializarSimulador(); }

        function evaluarProcedimiento() {
            let errores = [];
            if (!estadoActual.comunicadoPCC) errores.push("• Faltó establecer comunicación obligatoria con el PCC por el MICROFONO TETRA.");

            switch (nivelActual) {
                case 1:
                    if (!estadoActual.entornoRevisado) errores.push("• Faltó realizar la verificación visual del entorno.");
                    break;
                case 2:
                    if (!estadoActual.salonRevisado) errores.push("• Debe acudir al salón a verificar y bloquear manualmente la puerta.");
                    break;
                case 3:
                    if (!estadoActual.salonRevisado) errores.push("• No se accionó la llave de servicio de la primera puerta.");
                    break;
                case 4:
                    if (estadoActual.XFR !== 'AISLADO') errores.push("• Faltó accionar la llave XFR para aislar el freno neumático.");
                    break;
                case 5:
                    if (estadoActual.XFI !== 'AISLADO') errores.push("• Faltó accionar la llave XFI para aislar el Freno de Inmovilización.");
                    break;
                case 6:
                    if (estadoActual.XFP !== 'AISLADO') errores.push("• Faltó accionar la llave XFP para replegar frotadores.");
                    break;
                case 7:
                    let hs = historialAcciones.some(a => a.accion === 'PRESIONAR_HS');
                    let en = historialAcciones.some(a => a.accion === 'PRESIONAR_EN');
                    if (!hs || !en) errores.push("• Faltó ejecutar la secuencia de des-preparación (HS) y preparación (EN).");
                    break;
                case 8:
                    let rst = historialAcciones.some(a => a.accion === 'RESET_SACEM');
                    if (!rst) errores.push("• No se accionó el pulsador bajo tapa Reset SACEM (61S02) en el armario BT3.");
                    break;
                case 9:
                    if (estadoActual.K_IH_KSA !== 'AISLADO') errores.push("• Debe disponer el conmutador K.IH.KSA en posición AISLADO.");
                    break;
                case 10:
                    let fu = historialAcciones.some(a => a.accion === 'CAMBIO_MANDO' && a.detalles.posicion === 'FU');
                    if (!fu) errores.push("• Faltó aplicar Freno de Urgencia (FU) inmediato para detener el tren.");
                    break;
                case 11:
                    if (!estadoActual.escalaDesplegada) errores.push("• Debe desplegar e instalar la escala de socorro para el descenso.");
                    break;
            }

            let msg = errores.length === 0 ? "🟢 EVALUACIÓN: APROBADO (100%)\nProcedimiento ejecutado al pie de la letra según manual NS-16." : "🔴 EVALUACIÓN: REPROBADO\n" + errores.join("\n");
            if (estadoActual.ayudaPCCUsada) msg += "\n\n💡 Nota: Se recurrió a la pauta guiada del PCC.";
            actualizarPanel("EVALUACIÓN DEL PROCEDIMIENTO", msg);
        }

        window.onload = () => { 
            inicializarSimulador(); 
            setTimeout(() => { imageMapResize(); }, 200);
        };
        window.onresize = () => { imageMapResize(); };
    </script>
</body>
</html>
