<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Cabina Metro NS-16 - Formación de Conductores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: #ffffff; overflow-x: hidden; padding: 10px;
        }
        .cabina-wrapper {
            position: relative; width: 100vw; max-width: 1400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); border-radius: 8px; overflow: hidden;
            background: #000; margin: 0 auto;
        }
        .vista-container { display: none; position: relative; width: 100%; height: auto; }
        .vista-container.activa { display: block; }
        .cabina-img { width: 100%; height: auto; display: block; object-fit: contain; }
        area { cursor: pointer; }

        .top-bar { position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 20; }
        .nav-bar { position: absolute; top: 15px; left: 420px; display: flex; gap: 8px; z-index: 20; }
        .ext-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 20; background: rgba(0,0,0,0.85);
            padding: 8px 12px; border-radius: 8px; border: 1px solid #ffcc00;
        }

        .btn-ui {
            padding: 8px 14px; font-size: 12px; font-weight: bold; border: none;
            border-radius: 5px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s; text-decoration: none; display: inline-block;
        }
        .btn-ui:active { transform: scale(0.95); }
        .btn-nav { background-color: #34495e; color: white; border: 1px solid #5d6d7e; }
        .btn-nav.activo { background-color: #f39c12; color: black; border-color: #f1c40f; }
        .btn-menu { background-color: #8e44ad; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-finish { background-color: #2ecc71; color: white; }
        .btn-ext { background-color: #3498db; color: white; }
        .btn-armario { background-color: #e67e22; color: white; }
        .btn-ayuda { background-color: #0284c7; color: white; border: 1px solid #38bdf8; }

        .panel-pantalla {
            position: absolute; top: 15px; left: 20px; background: rgba(10, 12, 18, 0.94);
            border: 2px solid #ffcc00; padding: 12px 16px; border-radius: 6px; width: 380px;
            z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .panel-pantalla h2 { color: #ffcc00; font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
        .panel-pantalla p { font-size: 12px; color: #dddddd; line-height: 1.35; white-space: pre-line; }

        /* Panel Lateral - Ayuda Memoria */
        .sidebar-ayuda {
            position: fixed; top: 0; right: -350px; width: 350px; height: 100vh;
            background-color: rgba(15, 23, 42, 0.97); border-left: 2px solid #ffcc00;
            box-shadow: -5px 0 25px rgba(0,0,0,0.8); transition: right 0.3s ease;
            z-index: 150; display: flex; flex-direction: column; padding: 20px;
        }
        .sidebar-ayuda.open { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ffcc00; padding-bottom: 10px; margin-bottom: 15px; }
        .sidebar-header h3 { color: #ffcc00; font-size: 16px; text-transform: uppercase; }
        .btn-close-sidebar { background: none; border: none; color: #ffcc00; font-size: 20px; cursor: pointer; }
        .sidebar-content { overflow-y: auto; flex: 1; }
        .sidebar-content ul { list-style: none; }
        .sidebar-content li { font-size: 12px; color: #e2e8f0; padding: 8px 0; border-bottom: 1px solid #334155; display: flex; align-items: flex-start; gap: 8px; line-height: 1.3; }
        .sidebar-content li::before { content: "•"; color: #ffcc00; font-weight: bold; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #181a20; padding: 22px; border-radius: 8px; border: 2px solid #ffcc00;
            text-align: center; min-width: 360px; max-width: 580px; color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .modal-content h4 { margin-bottom: 8px; color: #ffcc00; font-size: 15px; text-transform: uppercase; }
        .modal-content p { font-size: 13px; margin-bottom: 14px; color: #ddd; line-height: 1.4; text-align: left; }
        .modal-options { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        
        .btn-opt {
            padding: 11px 13px; background: #252830; color: white; border: 1px solid #444;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;
        }
        .btn-opt:hover { background: #f39c12; color: #000; border-color: #f1c40f; }

        .armario-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; text-align: left; }
        .armario-item {
            background: #252830; padding: 10px; border-radius: 5px; border: 1px solid #444;
            display: flex; align-items: center; gap: 10px; font-size: 12px; cursor: pointer;
        }
        .armario-item input { cursor: pointer; transform: scale(1.2); }

        .game-over-modal { border-color: #e74c3c !important; background: #2a0808 !important; }
        .game-over-title { color: #e74c3c !important; font-size: 18px !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
</head>
<body>

        </div>

        <!-- VISTA BT3 COMPLETA -->

    <!-- Panel Lateral Desplegable - Ayuda Memoria -->
    <div id="sidebar-ayuda" class="sidebar-ayuda">
        <div class="sidebar-header">
            <h3>Ayuda Memoria</h3>
            <button class="btn-close-sidebar" onclick="toggleAyudaMemoria()">✖</button>
        </div>
        <div class="sidebar-content">
            <ul id="lista-ayuda"></ul>
        </div>
    </div>

    <!-- Modales de Operación -->
    <div id="modalSelector" class="modal">
        <div class="modal-content" id="modal-box">
            <h4 id="modal-titulo">Seleccionar Posición</h4>
            <div id="modal-options" class="modal-options"></div>
        </div>
    </div>

    <div id="modalArmario" class="modal">
        <div class="modal-content">
            <h4>🎒 ¿Qué llevar? (Equipamiento / EPP)</h4>
            <p>Seleccione los elementos que equipará para las intervenciones fuera de cabina:</p>
            <div class="armario-grid">
                <label class="armario-item"><input type="checkbox" id="eq-chaleco"> 🦺 Chaleco reflectante</label>
                <label class="armario-item"><input type="checkbox" id="eq-radio"> 📻 Radio portátil</label>
                <label class="armario-item"><input type="checkbox" id="eq-llave"> 🔑 Llave triangular</label>
                <label class="armario-item"><input type="checkbox" id="eq-paleta"> 🪵 Paleta de replegado</label>
                <label class="armario-item"><input type="checkbox" id="eq-linterna"> 🔦 Linterna</label>
                <label class="armario-item"><input type="checkbox" id="eq-extintor"> 🧯 Extintor</label>
                <label class="armario-item"><input type="checkbox" id="eq-escalera"> 🪜 Escalera</label>
            </div>
            <button class="btn-ui btn-finish" style="width:100%;" onclick="guardarEquipamiento()">Confirmar Elementos Equipados</button>
        </div>
    </div>

    <script>
        const estacionesL2 = ["Hospital El Pino", "La Cisterna", "Lo Ovalle", "Franklin", "Los Héroes", "Santa Ana", "Cal y Canto", "Vespucio Norte"];
        let estacionActual = "La Cisterna";
        let trenNumero = 108;
        let nivelActual = 11;
        let simulacionFinalizadaCritical = false;

        let equipamiento = {
            chaleco: false, radio: false, llave: false, paleta: false,
            linterna: false, extintor: false, escalera: false
        };

        let estadoActual = {
            SC: 'PA', ST: 'AUTO', KLVR: 'ADELANTE', MANIPULADOR: 'NEUTRO',
            KLOAN: 'DESAUTORIZADO', K_AA_IZ: 'NEUTRO / BLOQUEADO', RETROVISORES: 'NEUTRO / CERRADO', 
            K_IH_KSA: 'NORMAL',
            n11_comunicacionKsaAtendida: false,
            n11_alocucionPasajeros: false,
            n11_pccInformado: false,
            n11_verificacionEntorno: false,
            n11_verificacionAnden: false,
            n11_detenidoLetreroNoPasar: false
        };

        const ayudaMemoria = {
            2: [
                "Informar a pasajeros por PACIS (detención prolongada).",
                "Solicitar instrucción a P.C.C. por TETRA.",
                "Equipar: chaleco, radio y llave de bloqueo.",
                "Salir de cabina a la puerta averiada.",
                "Juntar hojas manualmente.",
                "Bloquear con llave de bloqueo.",
                "Verificar enclavamiento con las manos.",
                "Instalar cinta amarilla.",
                "Volver a cabina.",
                "Cerrar puertas (FD/FG) y verificar LMF + Monocoup.",
                "Verificar puerta en amarillo en DDU.",
                "Informar término a P.C.C. por TETRA."
            ],
            3: [
                "Recibir instrucción de P.C.C. por TETRA.",
                "Equipar: chaleco, radio y llave triangular.",
                "Salir a primera puerta primer coche (lado andén).",
                "Girar llave de servicio 1/4 vuelta horario.",
                "Verificar luz roja fija de aviso de cierre.",
                "Abrir puerta con las manos.",
                "Informar evacuación por PACIS.",
                "Verificar DDU (puerta blanca + alarma liberada).",
                "Normalizar llave de servicio.",
                "Cerrar puerta con las manos / automático.",
                "Volver a cabina.",
                "Informar término a P.C.C. por TETRA."
            ],
            7: [
                "Verificar puertas cerradas (LMF + Monocoup).",
                "Informar apagado de alumbrado por PACIS.",
                "Disponer SC en CML.",
                "Disponer ST en lado servicio.",
                "Disponer KLVR en Neutro.",
                "Presionar HS (Despreparar).",
                "Esperar 10 segundos.",
                "Presionar EN (Preparar).",
                "Presionar DAP FI (desaplicar FI).",
                "Informar deslocalización a P.C.C. por TETRA."
            ],
            8: [
                "Confirmar instrucción de P.C.C. por TETRA.",
                "Disponer SC en CMC.",
                "Ir a armario BT3 (mamparo trasero derecho).",
                "Pulsar botón rojo bajo tapa por 5 segundos.",
                "Volver a pupitre y esperar 20 segundos.",
                "Verificar platina SACEM (PA, CMC, CMP parpadeantes).",
                "Informar término a P.C.C. por TETRA."
            ],
            10: [
                "Confirmar instrucción de P.C.C. por TETRA.",
                "Disponer SC en FS, ST en N, KLVR en Neutro (esperar 5 s).",
                "Retomar mandos: SC en CMC, ST en AUTO.",
                "Pulsar FD/FG (Monocoup).",
                "Si gatilla FU PA: Asegurar puertas cerradas, informar por PACIS, HS, esperar 10 s, EN, DAP FI.",
                "Informar estado a P.C.C. por TETRA."
            ],
            11: [
                "Girar K.IH.KSA a Aislado y pulsar FD (Monocoup).",
                "Mirar espejos/ventanas hacia atrás.",
                "Aceptar llamada en PACIS.",
                "Identificar puerta en DDU.",
                "Informar a P.C.C. por TETRA (recibir orden de retroceso).",
                "Informar retroceso por PACIS.",
                "Disponer SC en CML, KLVR en Atrás.",
                "Pulsar FD (verificar LMF + Monocoup).",
                "Verificar andén desde puerta cabina (sin despeje).",
                "Abrir espejo retrovisor derecho.",
                "Retroceder a máximo 5 Km/h.",
                "Detener frente a letrero 'No Pasar'.",
                "Disponer ST en Derecha y comandar K.L.O.AN.",
                "Normalizar KLVR y K.IH.KSA.",
                "Equipar: chaleco, radio y llave triangular.",
                "Salir a salón y girar K.SA 1/4 vuelta antihorario.",
                "Verificar apagado de luz de cierre y luz fija de coche.",
                "Volver a cabina e informar término a P.C.C. por TETRA."
            ]
        };

        function toggleAyudaMemoria() {
            document.getElementById('sidebar-ayuda').classList.toggle('open');
        }

        function cargarAyudaMemoria() {
            const listaUl = document.getElementById('lista-ayuda');
            listaUl.innerHTML = '';
            (ayudaMemoria[nivelActual] || []).forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                listaUl.appendChild(li);
            });
        }

        function inicializarSimulador() {
            const urlParams = new URLSearchParams(window.location.search);
            nivelActual = parseInt(urlParams.get('nivel')) || 11;
            estacionActual = estacionesL2[Math.floor(Math.random() * estacionesL2.length)];
            trenNumero = 100 + Math.floor(Math.random() * 20);

            simulacionFinalizadaCritical = false;
            cargarAyudaMemoria();

            if (nivelActual === 11) {
                actualizarPanel("11. KSA en PA con Retroceso", `Estación ${estacionActual} - Tren ${trenNumero}\n🚨 Alarma de Pasajero (K.SA) activada en PA. Atienda la llamada y aplique protocolo con retroceso.`);
            }
        }

        function cambiarVista(vista) {
            if (simulacionFinalizadaCritical) return;
            document.querySelectorAll('.vista-container').forEach(el => el.classList.remove('activa'));
            document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('activo'));

            if (vista === 'pupitre') {
                document.getElementById('vista-pupitre').classList.add('activa');
                document.getElementById('btn-vista-pupitre').classList.add('activo');
            } else {
                document.getElementById('vista-bt3').classList.add('activa');
                document.getElementById('btn-vista-bt3').classList.add('activo');
            }
            setTimeout(() => { imageMapResize(); }, 50);
        }

        function actualizarPanel(titulo, desc) {
            document.getElementById('info-titulo').innerText = titulo;
            document.getElementById('info-desc').innerText = desc;
        }

        function reproducirSonidoMonocoup() {
            const audio = document.getElementById('audio-monocoup');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio no reproducido por interacción previa."));
            }
        }

        function abrirArmarioEquipamiento() {
            if (simulacionFinalizadaCritical) return;
            document.getElementById('modalArmario').style.display = 'flex';
        }

        function guardarEquipamiento() {
            equipamiento.chaleco = document.getElementById('eq-chaleco').checked;
            equipamiento.radio = document.getElementById('eq-radio').checked;
            equipamiento.llave = document.getElementById('eq-llave').checked;
            equipamiento.paleta = document.getElementById('eq-paleta').checked;
            equipamiento.linterna = document.getElementById('eq-linterna').checked;
            equipamiento.extintor = document.getElementById('eq-extintor').checked;
            equipamiento.escalera = document.getElementById('eq-escalera').checked;

            document.getElementById('modalArmario').style.display = 'none';
            actualizarPanel("¿Qué llevar?", "🎒 Elementos seleccionados guardados en equipamiento.");
        }

        function accionExterior(tipo) {
            if (simulacionFinalizadaCritical) return;
            if (tipo === 'VERIFICAR_ENTORNO') {
                estadoActual.n11_verificacionEntorno = true;
                actualizarPanel("Mirar Entorno / Vías", "👁️ Observando espejos y ventanas hacia atrás. Vías y entorno despejados para maniobra.");
            } else if (tipo === 'VERIFICAR_ANDEN_CABINA') {
                estadoActual.n11_verificacionAnden = true;
                actualizarPanel("Verificar Andén", "👁️ Mirada desde la puerta de cabina hacia el andén. Sin despeje visual de anormalidad.");
            }
        }

        function interactuarPuertaSalon() {
            if (simulacionFinalizadaCritical) return;
            actualizarPanel("Salir de Cabina", "🚶 Saliendo a salón / andén para intervención directa.");
        }

        function interactuarPACIS() {
            if (simulacionFinalizadaCritical) return;
            document.getElementById('modal-titulo').innerText = 'Sistema PACIS / Interfonía';
            let container = document.getElementById('modal-options');
            container.innerHTML = '';

            if (nivelActual === 11) {
                let btnAtender = document.createElement('button');
                btnAtender.className = 'btn-opt';
                btnAtender.innerHTML = '📞 Validar / Atender comunicación de emergencia K.SA';
                btnAtender.onclick = () => {
                    estadoActual.n11_comunicacionKsaAtendida = true;
                    document.getElementById('modalSelector').style.display = 'none';
                    actualizarPanel("PACIS - Interfonía", "📞 Comunicación de emergencia K.SA atendida y validada.");
                };
                container.appendChild(btnAtender);

                let btnAnuncio = document.createElement('button');
                btnAnuncio.className = 'btn-opt';
                btnAnuncio.innerHTML = '📢 Informar a pasajeros motivo de detención y retroceso';
                btnAnuncio.onclick = () => {
                    estadoActual.n11_alocucionPasajeros = true;
                    document.getElementById('modalSelector').style.display = 'none';
                    actualizarPanel("PACIS - Altavoces", "📢 Anuncio emitido: Se informa a los pasajeros la maniobra de retroceso asistido del tren.");
                };
                container.appendChild(btnAnuncio);
            }

            document.getElementById('modalSelector').style.display = 'flex';
        }

        function abrirOpcionesTETRA() {
            if (simulacionFinalizadaCritical) return;
            document.getElementById('modal-titulo').innerText = 'Micrófono TETRA - P.C.C.';
            let container = document.getElementById('modal-options');
            container.innerHTML = '';

            let btnPcc = document.createElement('button');
            btnPcc.className = 'btn-opt';
            btnPcc.innerHTML = '📻 Comunicar novedad K.SA y solicitar orden de retroceso a P.C.C.';
            btnPcc.onclick = () => {
                estadoActual.n11_pccInformado = true;
                document.getElementById('modalSelector').style.display = 'none';
                actualizarPanel("P.C.C.", `📻 P.C.C.: "Enterado Conductor Tren ${trenNumero}. Autorizado retroceso a velocidad reducida (máx 5 km/h)."`);
            };
            container.appendChild(btnPcc);

            document.getElementById('modalSelector').style.display = 'flex';
        }

        function interactuarDDU() {
            if (simulacionFinalizadaCritical) return;
            actualizarPanel("Pantalla DDU", "[DDU - Monitor]\nIdentificación de alarma de emergencia activada en coche.");
        }

        function abrirSelector(elemento, opciones) {
            if (simulacionFinalizadaCritical) return;
            document.getElementById('modal-titulo').innerText = `${elemento} (Actual: ${estadoActual[elemento] || 'NORMAL'})`;
            let container = document.getElementById('modal-options');
            container.innerHTML = '';
            opciones.forEach(opc => {
                let btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.innerText = opc;
                btn.onclick = () => seleccionarOpcion(elemento, opc);
                container.appendChild(btn);
            });
            document.getElementById('modalSelector').style.display = 'flex';
        }

        function seleccionarOpcion(elemento, opcion) {
            document.getElementById('modalSelector').style.display = 'none';
            
            // Corrección en guardado de variables internas
            if (elemento === 'K.IH.KSA') {
                estadoActual.K_IH_KSA = opcion;
            } else {
                estadoActual[elemento] = opcion;
            }

            // Lógica de tracción en retroceso
            if (elemento === 'MANIPULADOR' && opcion === 'TRACCIÓN 5 KM/H' && nivelActual === 11) {
                if (estadoActual.KLVR === 'ATRÁS' && estadoActual.SC === 'CML') {
                    estadoActual.n11_detenidoLetreroNoPasar = true;
                    actualizarPanel("Retroceso Asistido (5 Km/h)", "🚆 Tren traccionando en retroceso a velocidad normada (máx 5 km/h).\n🛑 Se alcanza posición correcta y se detiene el tren frente al letrero 'NO PASAR'.");
                    return;
                }
            }

            actualizarPanel(`Mando ${elemento}`, `Posición seleccionada: ${opcion}`);
        }

        function accionBoton(tipo) {
            if (simulacionFinalizadaCritical) return;
            if (tipo === 'FG' || tipo === 'FD') {
                reproducirSonidoMonocoup();
            }
            actualizarPanel("Acción Pupitre", `Pulsador ${tipo} activado.`);
        }

        function accionResetSacem() {
            if (simulacionFinalizadaCritical) return;
            actualizarPanel("BT3 - Reset SACEM", "🔴 Botón Reset SACEM accionado.");
        }

        function resetearSimulador() { inicializarSimulador(); }

        function evaluarProcedimiento() {
            if (simulacionFinalizadaCritical) return;
            let errores = [];

            if (nivelActual === 11) {
                if (estadoActual.K_IH_KSA !== 'AISLADO') errores.push("• BT3: Faltó aislar la alarma K.SA situando el conmutador K.IH.KSA en 'AISLADO'.");
                if (!estadoActual.n11_comunicacionKsaAtendida) errores.push("• PACIS: Faltó contestar/atender la llamada de comunicación de emergencia K.SA.");
                if (!estadoActual.n11_verificacionEntorno) errores.push("• ENTORNO: Faltó verificar entorno/vías (mirar hacia atrás) antes de mover el tren.");
                if (!estadoActual.n11_pccInformado) errores.push("• TETRA: Faltó solicitar autorización a P.C.C. antes de iniciar maniobra de retroceso.");
                if (!estadoActual.n11_alocucionPasajeros) errores.push("• PACIS: Faltó informar a los pasajeros sobre la maniobra de retroceso asistido.");
                if (estadoActual.KLVR !== 'ATRÁS') errores.push("• INVERSOR: KLVR debía estar dispuesto en 'ATRÁS' para ejecutar la maniobra.");
                if (!estadoActual.n11_detenidoLetreroNoPasar) errores.push("• TRACCIÓN: Faltó traccionar a 5 km/h hasta detenerse frente al letrero 'NO PASAR'.");
            }

            let msg = errores.length === 0 ? 
                "🟢 EVALUACIÓN: APROBADO (100%)\nProcedimiento normativo ejecutado con estricto apego a las normas." : 
                "🔴 EVALUACIÓN: REPROBADO\nSe detectaron las siguientes omisiones normativas al terminar el ejercicio:\n\n" + errores.join("\n");
            
            actualizarPanel("EVALUACIÓN DEL PROCEDIMIENTO", msg);
        }

        window.onload = () => { 
            inicializarSimulador(); 
            setTimeout(() => { imageMapResize(); }, 200);
        };
        window.onresize = () => { imageMapResize(); };
    </script>
</body>
</html>
