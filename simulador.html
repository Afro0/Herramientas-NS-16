<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Cabina Metro NS-16 - Formación de Conductores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; color: #ffffff; overflow-x: hidden; padding: 10px;
        }
        .cabina-wrapper {
            position: relative; width: 100vw; max-width: 1400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); border-radius: 8px; overflow: hidden;
            background: #000; margin: 0 auto;
        }
        .vista-container { display: none; position: relative; width: 100%; height: auto; }
        .vista-container.activa { display: block; }
        .cabina-img { width: 100%; height: auto; display: block; object-fit: contain; }
        area { cursor: pointer; }

        .top-bar { position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 20; }
        .nav-bar { position: absolute; top: 15px; left: 420px; display: flex; gap: 8px; z-index: 20; }
        .ext-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 20; background: rgba(0,0,0,0.85);
            padding: 8px 12px; border-radius: 8px; border: 1px solid #ffcc00;
        }

        .btn-ui {
            padding: 8px 14px; font-size: 12px; font-weight: bold; border: none;
            border-radius: 5px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s; text-decoration: none; display: inline-block;
        }
        .btn-ui:active { transform: scale(0.95); }
        .btn-nav { background-color: #34495e; color: white; border: 1px solid #5d6d7e; }
        .btn-nav.activo { background-color: #f39c12; color: black; border-color: #f1c40f; }
        .btn-menu { background-color: #8e44ad; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-finish { background-color: #2ecc71; color: white; }
        .btn-ext { background-color: #3498db; color: white; }

        .panel-pantalla {
            position: absolute; top: 15px; left: 20px; background: rgba(10, 12, 18, 0.94);
            border: 2px solid #ffcc00; padding: 12px 16px; border-radius: 6px; width: 380px;
            z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .panel-pantalla h2 { color: #ffcc00; font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
        .panel-pantalla p { font-size: 12px; color: #dddddd; line-height: 1.35; white-space: pre-line; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #181a20; padding: 22px; border-radius: 8px; border: 2px solid #ffcc00;
            text-align: center; min-width: 360px; max-width: 560px; color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .modal-content h4 { margin-bottom: 8px; color: #ffcc00; font-size: 15px; text-transform: uppercase; }
        .modal-content p { font-size: 13px; margin-bottom: 14px; color: #ddd; line-height: 1.4; text-align: left; }
        .modal-options { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        
        .btn-opt {
            padding: 11px 13px; background: #252830; color: white; border: 1px solid #444;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;
        }
        .btn-opt:hover { background: #f39c12; color: #000; border-color: #f1c40f; }

        .status-badge {
            display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px;
            font-weight: bold; margin-bottom: 10px; background: #2c3e50; color: #00ffcc; border: 1px solid #00ffcc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
</head>
<body>

    <div class="cabina-wrapper">
        <div class="panel-pantalla">
            <h2 id="info-titulo">Cargando Nivel...</h2>
            <p id="info-desc">Inicializando protocolo operativo...</p>
        </div>

        <div class="nav-bar">
            <button id="btn-vista-pupitre" class="btn-ui btn-nav activo" onclick="cambiarVista('pupitre')">Pupitre Principal</button>
            <button id="btn-vista-bt3" class="btn-ui btn-nav" onclick="cambiarVista('bt3')">Armario BT3</button>
        </div>

        <div class="top-bar">
            <a href="menu_simulador.html" class="btn-ui btn-menu">Cambiar Nivel</a>
            <button class="btn-ui btn-reset" onclick="resetearSimulador()">Resetear</button>
            <button class="btn-ui btn-finish" onclick="evaluarProcedimiento()">Terminar</button>
        </div>

        <div class="ext-bar" id="ext-bar">
            <button class="btn-ui btn-ext" onclick="accionExterior('VERIFICAR_ENTORNO')">Mirar Entorno / Vías (Atrás)</button>
            <button class="btn-ui btn-ext" style="background-color:#9b59b6;" onclick="accionExterior('VERIFICAR_ANDEN_CABINA')">Verificar Andén desde Puerta Cabina</button>
            <button class="btn-ui btn-ext" style="background-color:#e67e22;" onclick="interactuarPuertaSalon()">Salón de Pasajeros / Rearme KSA</button>
        </div>

        <!-- VISTA PUPITRE -->
        <div id="vista-pupitre" class="vista-container activa">
            <img src="cabina.jpg" usemap="#mapa-pupitre" class="cabina-img" alt="Cabina NS-16">
            <map name="mapa-pupitre">
                <area target="" alt="FG" title="Cierre Puertas Izquierdas (FG)" href="javascript:accionBoton('FG')" coords="569,1279,23" shape="circle">
                <area target="" alt="FD" title="Cierre Puertas Derechas (FD)" href="javascript:accionBoton('FD')" coords="2304,1301,21" shape="circle">
                <area target="" alt="EN" title="Energización (EN)" href="javascript:accionBoton('EN')" coords="2349,1223,25" shape="circle">
                <area target="" alt="HS" title="Des-preparación / Abonado (HS)" href="javascript:accionBoton('HS')" coords="2257,1218,26" shape="circle">
                <area target="" alt="MANIPULADOR" title="Manipulador de Conducción" href="javascript:abrirSelector('MANIPULADOR', ['TRACCIÓN 5 KM/H', 'TRACCIÓN NORMAL', 'NEUTRO', 'FRENO', 'FU'])" coords="1879,1150,2001,1234" shape="rect">
                <area target="" alt="PACIS" title="PACIS" href="javascript:interactuarPACIS()" coords="2028,903,2294,1094" shape="rect">
                <area target="" alt="DDU" title="Pantalla DDU" href="javascript:interactuarDDU()" coords="1581,840,1839,1049" shape="rect">
                <area target="" alt="RETROVISORES" title="Conmutador Espejos Retrovisores (K.ES)" href="javascript:abrirSelector('RETROVISORES', ['IZQUIERDA', 'NEUTRO / CERRADO', 'DERECHA'])" coords="1521,1128,28" shape="circle">
                <area target="" alt="PTT" title="PTT (Megafonía Salón)" href="javascript:interactuarPACIS()" coords="1459,1129,20" shape="circle">
                <area target="" alt="LMFS" title="Lámparas Azules Enclavamiento Puertas (LMFS)" href="javascript:accionBoton('LMFS')" coords="1327,844,48" shape="circle">
                <area target="" alt="KLVR" title="Inversor de Marcha (KLVR)" href="javascript:abrirSelector('KLVR', ['ADELANTE', 'NEUTRO', 'ATRÁS'])" coords="1158,981,1208,1088" shape="rect">
                <area target="" alt="MICROFONO TETRA" title="Micrófono TETRA (PCC)" href="javascript:abrirOpcionesTETRA()" coords="1026,1073,1148,1208" shape="rect">
                <!-- Selector físico corregido: Posición física CM (Conducción Manual / CML) -->
                <area target="" alt="SC" title="Selector Modo Conducción (SC)" href="javascript:abrirSelector('SC', ['PA', 'CMC', 'CM', 'FS'])" coords="402,1141,528,1260" shape="rect">
                <area target="" alt="ST" title="Selector Sentido (ST)" href="javascript:abrirSelector('ST', ['I', 'AUTO', 'D', 'N'])" coords="786,1126,915,1218" shape="rect">
                <area target="" alt="KLOAN" title="Comando Apertura Puertas (KLOAN)" href="javascript:abrirSelector('KLOAN', ['DESAUTORIZADO', 'AUTORIZADO (APERTURA)'])" coords="1216,1112,1266,1214" shape="rect">
                <area target="" alt="K.AA.IZ" title="Autorización Puertas Izquierdas (K.AA.IZ)" href="javascript:abrirSelector('K.AA.IZ', ['NEUTRO / BLOQUEADO', 'AUTORIZADO (IZQUIERDA)'])" coords="1101,844,24" shape="circle">
            </map>
        </div>

        <!-- VISTA BT3 -->
        <div id="vista-bt3" class="vista-container">
            <img src="bt3.jpg" usemap="#mapa-bt3" class="cabina-img" alt="Armario BT3">
            <map name="mapa-bt3">
                <area target="" alt="K.IH.KSA" title="K.IH.KSA" href="javascript:abrirSelector('K.IH.KSA', ['NORMAL', 'AISLADO'])" coords="1652,455,109" shape="circle">
            </map>
        </div>
    </div>

    <!-- Modal General -->
    <div id="modalSelector" class="modal">
        <div class="modal-content">
            <h4 id="modal-titulo">Seleccionar Posición</h4>
            <div id="modal-options" class="modal-options"></div>
        </div>
    </div>

    <!-- Modal Intervención en Salón -->
    <div id="modalSalonGuiado" class="modal">
        <div class="modal-content">
            <h4 id="salon-paso-titulo">Intervención en Salón de Pasajeros</h4>
            <div id="salon-badge-status" class="status-badge">Acción Puntual</div>
            <p id="salon-paso-desc">Seleccione la acción normativa que desea realizar en este momento:</p>
            <div id="salon-paso-opciones" class="modal-options"></div>
            <button class="btn-ui btn-reset" style="margin-top:15px; background-color:#555;" onclick="cerrarModalSalonGuiado()">Volver a Cabina de Conducción</button>
        </div>
    </div>

    <script>
        const estacionesL2 = ["Hospital El Pino", "La Cisterna", "Lo Ovalle", "Franklin", "Los Héroes", "Santa Ana", "Cal y Canto", "Vespucio Norte"];
        let estacionActual = "La Cisterna";
        let trenNumero = 104;
        let nivelActual = 9;

        let estadoActual = {
            SC: 'PA', ST: 'AUTO', KLVR: 'ADELANTE', MANIPULADOR: 'NEUTRO',
            KLOAN: 'DESAUTORIZADO', K_AA_IZ: 'NEUTRO / BLOQUEADO', RETROVISORES: 'NEUTRO / CERRADO', K_IH_KSA: 'NORMAL',
            
            // Nivel 2
            informoPasajerosDetencion: false, solicitoInstruccionPCC: false, hojasJuntadasManualmente: false,
            bloqueadaConLlaveExterior: false, verificadoEnclavamientoManos: false, cintaFueraServicioInstalada: false,
            comprobacionCierreRealizada: false, monocoupConfirmado: false, lmfEncendida: false, dduVerificadaFinal: false, comunicadoPCC_Final: false,

            // Nivel 3
            instruccionPCC_Liberar: false, llaveTriangularGiradaHorario: false, lamparaAnuncioRojoFijo: false,
            puertaAbiertaManos: false, informoPasajerosEvacuacion: false, llaveServicioNormalizada: false,
            puertaCerradaManos: false, dduVerificadaLiberacion: false,

            // Nivel 9
            n9_kihksaAislado: false,
            n9_monocoupAislamientoConfirmado: false,
            n9_entornoRevisadoAtras: false,
            n9_pacisAceptado: false,
            n9_dduInicialVerificada: false,
            n9_pccInstruyoRetroceso: false,
            n9_altavozInformoRetroceso: false,
            n9_segundoMonocoupConfirmado: false,
            n9_andenVerificadoCabina: false,
            n9_espejoDesplegado: false,
            n9_traccionoMax5: false,
            n9_detuvoNoPasar: false,
            n9_aperturaKloanComandada: false,
            n9_klvrNormalizado: false,
            n9_kihksaNormalizado: false,
            n9_dduPreSalidaVerificada: false,
            n9_equipamientoSeguridadCerrarCabina: false,
            n9_rearmeKsaAntihorario: false,
            n9_pccInformeFinalMotivo: false
        };

        let historialAcciones = [];
        let elementoActualModal = '';

        function inicializarSimulador() {
            const urlParams = new URLSearchParams(window.location.search);
            nivelActual = parseInt(urlParams.get('nivel')) || 9;
            estacionActual = estacionesL2[Math.floor(Math.random() * estacionesL2.length)];
            trenNumero = 100 + Math.floor(Math.random() * 20);

            historialAcciones = [];
            estadoActual.lmfEncendida = (nivelActual !== 2 && nivelActual !== 9);

            if (nivelActual === 2) {
                actualizarPanel("2. Bloqueo de Puertas", `Estación ${estacionActual} - Tren ${trenNumero}\nSe detecta avería de enclavamiento.`);
            } else if (nivelActual === 3) {
                actualizarPanel("3. Liberación de Puertas", `Estación ${estacionActual} - Tren ${trenNumero}\nEvacuación ordenada por PCC.`);
            } else if (nivelActual === 9) {
                actualizarPanel("9. KSA Salida Estación (Retroceso)", `Estación ${estacionActual} - Tren ${trenNumero}\nSe activa alerta KSA al iniciar la marcha. Ejecute el procedimiento normativo estricto de 18 pasos.`);
            }
        }

        function cambiarVista(vista) {
            document.querySelectorAll('.vista-container').forEach(el => el.classList.remove('activa'));
            document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('activo'));

            if (vista === 'pupitre') {
                document.getElementById('vista-pupitre').classList.add('activa');
                document.getElementById('btn-vista-pupitre').classList.add('activo');
            } else {
                document.getElementById('vista-bt3').classList.add('activa');
                document.getElementById('btn-vista-bt3').classList.add('activo');
            }
            setTimeout(() => { imageMapResize(); }, 50);
        }

        function actualizarPanel(titulo, desc) {
            document.getElementById('info-titulo').innerText = titulo;
            document.getElementById('info-desc').innerText = desc;
        }

        function registrarAccion(accion, detalles) {
            historialAcciones.push({ accion, detalles, tiempo: Date.now() });
        }

        function accionExterior(tipo) {
            if (tipo === 'VERIFICAR_ENTORNO') {
                estadoActual.n9_entornoRevisadoAtras = true;
                registrarAccion('PASO2_VERIFICAR_ENTORNO_ATRAS', {});
                actualizarPanel("Paso 2: Verificación de Entorno", "Verificación visual realizada hacia atrás por ambos lados del tren: Sin impedimentos para el movimiento.");
            } else if (tipo === 'VERIFICAR_ANDEN_CABINA') {
                if (nivelActual === 9 && !estadoActual.n9_segundoMonocoupConfirmado) {
                    actualizarPanel("⚠️ ADVERTENCIA OPERATIVA", "Debe disponer ST en Auto, SC en CM (CML), KLVR en Atrás y pulsar FD/FG (Paso 7) antes de verificar el andén desde la puerta de cabina.");
                    return;
                }
                estadoActual.n9_andenVerificadoCabina = true;
                registrarAccion('PASO8_VERIFICAR_ANDEN_CABINA', {});
                actualizarPanel("Paso 8: Verificación de Andén", "Inspección realizada desde la puerta de cabina ante clientes cercanos al tren. Ingreso al interior de la cabina completado.");
            }
        }

        function interactuarPuertaSalon() {
            let titulo = document.getElementById('salon-paso-titulo');
            let status = document.getElementById('salon-badge-status');
            let desc = document.getElementById('salon-paso-desc');
            let opc = document.getElementById('salon-paso-opciones');
            opc.innerHTML = '';

            if (nivelActual === 9) {
                titulo.innerText = "Rearme KSA en Salón (Pasos 15 y 16)";
                status.innerText = "Intervención de Seguridad KSA";
                desc.innerText = "Te equipas con chaleco de seguridad, radio portable y llave triangular. Puerta de cabina cerrada:";

                opc.innerHTML = `
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N9_REARME_KSA')">Rearmar KSA: Introducir llave triangular en orificio del conmutador y girar suavemente en sentido ANTIHORARIO 1/4 de vuelta.</button>
                `;
            } else if (nivelActual === 2) {
                titulo.innerText = "Operación de Bloqueo de Puerta (En Salón)";
                status.innerText = "Intervención Física local";
                desc.innerText = "Te encuentras frente a la puerta averiada del Coche 2:";
                opc.innerHTML = `
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N2_JUNTAR_HOJAS')">1. Juntar ambas hojas manualmente</button>
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N2_BLOQUEAR_LLAVE')">2. Bloquear con Llave de Bloqueo de puerta exterior</button>
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N2_VERIFICAR_MANOS')">3. Verificar el correcto enclavamiento de la puerta con las manos</button>
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N2_CINTA')">4. Instalar cinta amarilla de puerta fuera de servicio</button>
                `;
            } else if (nivelActual === 3) {
                titulo.innerText = "Liberación Manual de Puerta (En Salón)";
                status.innerText = "Intervención de Evacuación";
                desc.innerText = "Te encuentras en la 1.ª puerta del 1.er coche lado andén:";
                opc.innerHTML = `
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N3_LLAVE_TRIANGULAR')">1. Introducir llave triangular y girar en sentido horario 1/4 vuelta</button>
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N3_ABRIR_MANOS')">2. Abrir la puerta con las manos</button>
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N3_NORMALIZAR_LLAVE')">3. Normalizar llave de servicio</button>
                    <button class="btn-opt" onclick="ejecutarAccionSalon('N3_CERRAR_MANOS')">4. Cerrar la puerta con las manos</button>
                `;
            }

            document.getElementById('modalSalonGuiado').style.display = 'flex';
        }

        function cerrarModalSalonGuiado() {
            document.getElementById('modalSalonGuiado').style.display = 'none';
        }

        function ejecutarAccionSalon(accion) {
            cerrarModalSalonGuiado();
            
            if (accion === 'N9_REARME_KSA') {
                if (estadoActual.K_IH_KSA !== 'NORMAL' || (estadoActual.KLVR !== 'NEUTRO' && estadoActual.KLVR !== 'ADELANTE')) {
                    actualizarPanel("⚠️ DESVÍO DE PROTOCOLO", "Paso 13 incompleto: Debe normalizar KLVR y K.IH.KSA en cabina ANTES de salir a rearmar el KSA al salón.");
                    return;
                }
                estadoActual.n9_equipamientoSeguridadCerrarCabina = true;
                estadoActual.n9_rearmeKsaAntihorario = true;
                estadoActual.lmfEncendida = true;
                registrarAccion('PASO15_16_REARME_KSA_ANTIHORARIO', {});
                actualizarPanel("Pasos 15 y 16: Rearme KSA Salón", "Llave triangular introducida. Giro suave en sentido ANTIHORARIO (~1/4 vuelta) realizado.\n✅ Lámpara de anuncio de cierre se apaga y lámpara testigo de puerta del coche enciende fija.\n💡 Retorne a la cabina para informar a PCC (Paso 18).");
            }
            else if (accion === 'N2_JUNTAR_HOJAS') { estadoActual.hojasJuntadasManualmente = true; actualizarPanel("Salón", "Hojas juntadas manualmente."); }
            else if (accion === 'N2_BLOQUEAR_LLAVE') { estadoActual.bloqueadaConLlaveExterior = true; actualizarPanel("Salón", "Llave de bloqueo exterior accionada."); }
            else if (accion === 'N2_VERIFICAR_MANOS') { estadoActual.verificadoEnclavamientoManos = true; actualizarPanel("Salón", "Enclavamiento verificado con las manos."); }
            else if (accion === 'N2_CINTA') { estadoActual.cintaFueraServicioInstalada = true; actualizarPanel("Salón", "Cinta amarilla adherida."); }
            else if (accion === 'N3_LLAVE_TRIANGULAR') { estadoActual.llaveTriangularGiradaHorario = true; actualizarPanel("Salón", "Llave triangular girada 1/4 horario."); }
            else if (accion === 'N3_ABRIR_MANOS') { estadoActual.puertaAbiertaManos = true; actualizarPanel("Salón", "Puerta abierta con las manos."); }
            else if (accion === 'N3_NORMALIZAR_LLAVE') { estadoActual.llaveServicioNormalizada = true; actualizarPanel("Salón", "Llave de servicio normalizada."); }
            else if (accion === 'N3_CERRAR_MANOS') { estadoActual.puertaCerradaManos = true; actualizarPanel("Salón", "Puerta cerrada manualmente."); }
        }

        function interactuarPACIS() {
            elementoActualModal = 'PACIS_OPCIONES';
            document.getElementById('modal-titulo').innerText = 'Sistema PACIS - Megafonía / Pantalla';
            let container = document.getElementById('modal-options');
            
            if (nivelActual === 9) {
                container.innerHTML = `
                    <button class="btn-opt" style="background:#2ecc71; color:#000;" onclick="emitirPACIS('N9_ACEPTAR_PACIS')">✔️ Paso 3: Validar comunicación K.SA pulsando en pantalla PACIS icono Aceptar.</button>
                    <button class="btn-opt" onclick="emitirPACIS('N9_ALTAVOZ_MOVERA')">📢 Paso 6: Informar a pasajeros (por Altavoz) del motivo de detención y que el tren se moverá.</button>
                `;
            } else if (nivelActual === 2) {
                container.innerHTML = `<button class="btn-opt" onclick="emitirPACIS('DETENCION_PROLONGADA')">📢 Informar detención prolongada</button>`;
            } else if (nivelActual === 3) {
                container.innerHTML = `<button class="btn-opt" onclick="emitirPACIS('EVACUACION')">📢 Informar evacuación</button>`;
            }
            document.getElementById('modalSelector').style.display = 'flex';
        }

        function emitirPACIS(tipo) {
            document.getElementById('modalSelector').style.display = 'none';
            if (tipo === 'N9_ACEPTAR_PACIS') {
                estadoActual.n9_pacisAceptado = true;
                registrarAccion('PASO3_VALIDAR_PACIS_KSA', {});
                actualizarPanel("Paso 3: Pantalla PACIS", "Comunicación K.SA validada pulsando Aceptar. Interfonía restablecida con el coche.");
            } else if (tipo === 'N9_ALTAVOZ_MOVERA') {
                if (!estadoActual.n9_pccInstruyoRetroceso) {
                    actualizarPanel("⚠️ ADVERTENCIA OPERATIVA", "Debe informar primero al PCC (Paso 5) para recibir la instrucción de retroceso antes de anunciar por altavoz.");
                    return;
                }
                estadoActual.n9_altavozInformoRetroceso = true;
                registrarAccion('PASO6_ALTAVOZ_INFORMACION_PASAJEROS', {});
                actualizarPanel("Paso 6: Megafonía Altavoz", "📢 Alocución emitida: Se informa a los pasajeros el motivo de la detención y que el tren realizará movimiento de retroceso.");
            } else if (tipo === 'DETENCION_PROLONGADA') { estadoActual.informoPasajerosDetencion = true; }
            else if (tipo === 'EVACUACION') { estadoActual.informoPasajerosEvacuacion = true; }
        }

        function abrirOpcionesTETRA() {
            elementoActualModal = 'TETRA_OPCIONES';
            document.getElementById('modal-titulo').innerText = 'Micrófono TETRA - P.C.C.';
            let container = document.getElementById('modal-options');

            if (nivelActual === 9) {
                container.innerHTML = `
                    <button class="btn-opt" onclick="comunicarPCC('N9_SOLICITAR_INSTRUCCION')">📻 Paso 5: Informar a P.C.C. (Solicitar instrucción de avance o retroceso).</button>
                    <button class="btn-opt" style="background:#2ecc71; color:#000;" onclick="comunicarPCC('N9_INFORME_FINAL')">📻 Paso 18: Informar a PCC del motivo del accionamiento del K.S.A y continuar rodado.</button>
                `;
            } else if (nivelActual === 2) {
                container.innerHTML = `
                    <button class="btn-opt" onclick="comunicarPCC('N2_INICIAL')">📻 Informar a P.C.C. avería detectada.</button>
                    <button class="btn-opt" onclick="comunicarPCC('N2_FINAL')">📻 Informar resultado a P.C.C.</button>
                `;
            } else if (nivelActual === 3) {
                container.innerHTML = `<button class="btn-opt" onclick="comunicarPCC('N3_INICIAL')">📻 Recibir instrucción de evacuación de PCC</button>`;
            }
            document.getElementById('modalSelector').style.display = 'flex';
        }

        function comunicarPCC(momento) {
            document.getElementById('modalSelector').style.display = 'none';
            if (momento === 'N9_SOLICITAR_INSTRUCCION') {
                if (!estadoActual.n9_dduInicialVerificada) {
                    actualizarPanel("⚠️ ADVERTENCIA OPERATIVA", "Debe verificar en DDU la puerta afectada (Paso 4) antes de informar al PCC.");
                    return;
                }
                estadoActual.n9_pccInstruyoRetroceso = true;
                registrarAccion('PASO5_INFORMAR_PCC_INSTRUCCION', {});
                actualizarPanel("Paso 5: P.C.C.", `📻 P.C.C.: "Enterado conductor tren ${trenNumero}. Autorizado a RETROCEDER en CM (CML) a máximo 5 km/h hasta la marca del letrero NO PASAR."`);
            } else if (momento === 'N9_INFORME_FINAL') {
                if (!estadoActual.n9_rearmeKsaAntihorario) {
                    actualizarPanel("⚠️ ADVERTENCIA OPERATIVA", "Debe acudir al salón a rearmar mecánicamente el KSA (Pasos 15 y 16) antes de entregar informe final al PCC.");
                    return;
                }
                estadoActual.n9_pccInformeFinalMotivo = true;
                registrarAccion('PASO18_INFORME_FINAL_PCC', {});
                actualizarPanel("Paso 18: P.C.C. - Cierre de Procedimiento", `📻 P.C.C.: "Recibido informe de accionamiento K.S.A. Conductor tren ${trenNumero}, queda autorizado a normalizar y continuar rodado."`);
            } else if (momento === 'N2_INICIAL') { estadoActual.solicitoInstruccionPCC = true; }
            else if (momento === 'N2_FINAL') { estadoActual.comunicadoPCC_Final = true; }
            else if (momento === 'N3_INICIAL') { estadoActual.instruccionPCC_Liberar = true; }
        }

        function interactuarDDU() {
            let textoDDU = "";
            if (nivelActual === 9) {
                if (!estadoActual.n9_pacisAceptado) {
                    textoDDU = `[DDU - Vista Operación]\n⚠️ ALERTA K.SA ACTIVA EN TREN\nUbicación: Coche 3 - Puerta 2\nEstado: Color Amarillo Fijo | Pendiente Aceptar en PACIS.`;
                } else if (estadoActual.n9_pacisAceptado && !estadoActual.n9_dduPreSalidaVerificada) {
                    estadoActual.n9_dduInicialVerificada = true;
                    textoDDU = `[DDU - Vista Operación]\n⚠️ Verificación Paso 4: K.SA accionado confirmado en Coche 3 Puerta 2.\nConmutador K.IH.KSA dispuesto en Aislado. Bucle abierto temporal.`;
                } else if (estadoActual.n9_klvrNormalizado && !estadoActual.n9_rearmeKsaAntihorario) {
                    estadoActual.n9_dduPreSalidaVerificada = true;
                    textoDDU = `[DDU - Vista Operación]\n⚠️ Verificación Paso 14: Confirmada ubicación Coche 3 Puerta 2 previa a salida a salón para rearme.`;
                } else if (estadoActual.n9_rearmeKsaAntihorario) {
                    textoDDU = `[DDU - Vista Operación]\n🟢 Sistema K.SA Normalizado\nUbicación Coche 3 Puerta 2: Color Verde (Enclavada)\nSin alarmas activas. Bucle de tracción restablecido.`;
                }
            } else if (nivelActual === 2) {
                textoDDU = estadoActual.comprobacionCierreRealizada ? `[DDU] 🟢 Puerta 3 Aislada (Candado Gris)` : `[DDU] ⚠️ Falla de enclavamiento`;
            } else if (nivelActual === 3) {
                textoDDU = estadoActual.llaveTriangularGiradaHorario ? `[DDU] ⚪ Puerta 1 Liberada (Blanco)` : `[DDU] 🟢 Puertas enclavadas`;
            }
            registrarAccion('LECTURA_DDU', { estado: textoDDU });
            actualizarPanel("Pantalla DDU", textoDDU);
        }

        function abrirSelector(elemento, opciones) {
            elementoActualModal = elemento;
            document.getElementById('modal-titulo').innerText = `${elemento} (Actual: ${estadoActual[elemento] || 'NORMAL'})`;
            let container = document.getElementById('modal-options');
            container.innerHTML = '';
            opciones.forEach(opc => {
                let btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.innerText = opc;
                btn.onclick = () => seleccionarOpcion(opc);
                container.appendChild(btn);
            });
            document.getElementById('modalSelector').style.display = 'flex';
        }

        function seleccionarOpcion(opcion) {
            document.getElementById('modalSelector').style.display = 'none';
            estadoActual[elementoActualModal] = opcion;
            registrarAccion('CAMBIO_MANDO', { elemento: elementoActualModal, posicion: opcion });

            if (nivelActual === 9) {
                if (elementoActualModal === 'K.IH.KSA' && opcion === 'AISLADO') {
                    estadoActual.n9_kihksaAislado = true;
                    actualizarPanel("Paso 1: Armario BT3", "K.IH.KSA dispuesto en posición AISLADO.\n🔔 *Recuerde pulsar FD para confirmar Monocoup.*");
                } else if (elementoActualModal === 'K.IH.KSA' && opcion === 'NORMAL') {
                    if (estadoActual.KLVR !== 'NEUTRO' && estadoActual.KLVR !== 'ADELANTE') {
                        actualizarPanel("⚠️ ADVERTENCIA", "Debe normalizar KLVR antes o simultáneamente con K.IH.KSA (Paso 13).");
                    }
                    estadoActual.n9_kihksaNormalizado = true;
                    actualizarPanel("Paso 13: Normalización BT3", "K.IH.KSA normalizado en posición NORMAL.");
                } else if (elementoActualModal === 'RETROVISORES' && (opcion === 'IZQUIERDA' || opcion === 'DERECHA')) {
                    estadoActual.n9_espejoDesplegado = true;
                    actualizarPanel("Paso 9: Conmutador Espejo (K.ES)", `Conmutador retrovisor accionado en ${opcion}.\n🪞 Espejo desplegado. Vigilancia visual activa para maniobra de retroceso.`);
                } else if (elementoActualModal === 'MANIPULADOR' && opcion === 'TRACCIÓN 5 KM/H') {
                    // Valida posición física CM (equivalente normativo CML)
                    if (estadoActual.KLVR === 'ATRÁS' && estadoActual.SC === 'CM' && estadoActual.n9_espejoDesplegado) {
                        estadoActual.n9_traccionoMax5 = true;
                        estadoActual.n9_detuvoNoPasar = true;
                        actualizarPanel("Pasos 10 y 11: Tracción y Detención", "Tren retrocediendo en CM (CML) a velocidad regulada máx 5 km/h vigilando desde espejo exterior...\n📍 Cabina detenida exactamente frente al letrero NO PASAR.");
                    } else if (estadoActual.KLVR === 'ATRÁS' && !estadoActual.n9_espejoDesplegado) {
                        actualizarPanel("⚠️ ADVERTENCIA GRAVE", "Intentó traccionar en retroceso sin desplegar previamente el espejo retrovisor con K.ES (Paso 9).");
                    } else {
                        actualizarPanel("Manipulador", `Posición: ${opcion}`);
                    }
                } else if (elementoActualModal === 'KLOAN' && opcion === 'AUTORIZADO (APERTURA)') {
                    if (!estadoActual.n9_detuvoNoPasar) {
                        actualizarPanel("⚠️ ADVERTENCIA", "Comandó apertura de puertas antes de detener la cabina frente al letrero NO PASAR.");
                        return;
                    }
                    estadoActual.n9_aperturaKloanComandada = true;
                    actualizarPanel("Paso 12: Apertura Puertas", "Apertura de puertas comandada con KLOAN (y KAAIZQ si correspondía). Pasajeros descendiendo/abordando.");
                } else if (elementoActualModal === 'KLVR' && (opcion === 'NEUTRO' || opcion === 'ADELANTE')) {
                    estadoActual.n9_klvrNormalizado = true;
                    actualizarPanel("Paso 13: Normalización Inversor", "Inversor KLVR normalizado.");
                } else {
                    actualizarPanel(`Mando ${elementoActualModal}`, `Posición: ${opcion}`);
                }
            } else {
                actualizarPanel(`Mando ${elementoActualModal}`, `Posición: ${opcion}`);
            }
        }

        function accionBoton(tipo) {
            if (tipo === 'FG' || tipo === 'FD') {
                if (nivelActual === 9) {
                    if (estadoActual.n9_kihksaAislado && !estadoActual.n9_monocoupAislamientoConfirmado) {
                        estadoActual.n9_monocoupAislamientoConfirmado = true;
                        estadoActual.monocoupConfirmado = true;
                        actualizarPanel("Paso 1: Confirmación Monocoup", `Pulsado ${tipo}.\n🔔 *¡CLANG! Monocoup obtenido confirmando bucle al aislar K.IH.KSA.*`);
                    } else if (estadoActual.KLVR === 'ATRÁS' && estadoActual.SC === 'CM') {
                        estadoActual.n9_segundoMonocoupConfirmado = true;
                        estadoActual.lmfEncendida = true;
                        actualizarPanel("Paso 7: Verificación CM (CML) / Retroceso", `Pulsado ${tipo}.\n🔔 *¡CLANG! Monocoup obtenido y Lámpara LMF encendida en azul.*`);
                    } else {
                        actualizarPanel(`Pulsador ${tipo}`, `Pulsado ${tipo}.`);
                    }
                } else if (nivelActual === 2) {
                    if (estadoActual.cintaFueraServicioInstalada) {
                        estadoActual.comprobacionCierreRealizada = true;
                        estadoActual.monocoupConfirmado = true;
                        estadoActual.lmfEncendida = true;
                        actualizarPanel("Paso 3: Cierre Cabina", `🔔 Monocoup y LMF obtenidos.`);
                    }
                }
            } else if (tipo === 'LMFS') {
                actualizarPanel("LMFS", estadoActual.lmfEncendida ? "ENCENDIDA (Azul)" : "APAGADA");
            } else {
                actualizarPanel("Acción", `Botón ${tipo} activado.`);
            }
        }

        function resetearSimulador() { inicializarSimulador(); }

        function evaluarProcedimiento() {
            let errores = [];

            if (nivelActual === 9) {
                if (!estadoActual.n9_kihksaAislado) errores.push("• PASO 1 INCORRECTO: Faltó disponer K.IH.KSA en posición Aislado en armario BT3.");
                if (!estadoActual.n9_monocoupAislamientoConfirmado) errores.push("• PASO 1 INCORRECTO: Faltó confirmar Monocoup pulsando el FD tras aislar K.IH.KSA.");
                if (!estadoActual.n9_entornoRevisadoAtras) errores.push("• PASO 2 OMITIDO: Faltó verificar hacia atrás por ambos lados del tren impedimentos de movimiento.");
                if (!estadoActual.n9_pacisAceptado) errores.push("• PASO 3 OMITIDO: Faltó validar comunicación K.SA pulsando el icono Aceptar en pantalla PACIS.");
                if (!estadoActual.n9_dduInicialVerificada) errores.push("• PASO 4 OMITIDO: Faltó verificar en DDU la o las puertas donde está accionado el K.SA.");
                if (!estadoActual.n9_pccInstruyoRetroceso) errores.push("• PASO 5 OMITIDO: Faltó informar a P.C.C. para recibir instrucción de retroceso.");
                if (!estadoActual.n9_altavozInformoRetroceso) errores.push("• PASO 6 OMITIDO: Faltó informar a pasajeros (por Altavoz) del motivo de detención y movimiento.");
                
                // Valida que SC se haya colocado en la posición física 'CM' (Conducción Manual / CML)
                let scCm = historialAcciones.some(a => a.accion === 'CAMBIO_MANDO' && a.detalles.elemento === 'SC' && a.detalles.posicion === 'CM');
                let klvrAtras = historialAcciones.some(a => a.accion === 'CAMBIO_MANDO' && a.detalles.elemento === 'KLVR' && a.detalles.posicion === 'ATRÁS');
                if (!scCm || !klvrAtras || !estadoActual.n9_segundoMonocoupConfirmado) {
                    errores.push("• PASO 7 INCORRECTO: Faltó disponer ST Auto, SC en CM (CML), KLVR en Atrás y pulsar FD/FG para verificar LMF y Monocoup.");
                }
                
                if (!estadoActual.n9_andenVerificadoCabina) errores.push("• PASO 8 OMITIDO: Faltó verificar lado andén ante clientes muy cercanos desde la puerta de cabina e ingresar.");
                if (!estadoActual.n9_espejoDesplegado) errores.push("• PASO 9 OMITIDO: Faltó abrir espejo con conmutador K.ES a derecha o izquierda para vigilar el retroceso.");
                if (!estadoActual.n9_traccionoMax5 || !estadoActual.n9_detuvoNoPasar) {
                    errores.push("• PASOS 10 y 11 INCORRECTOS: Faltó traccionar a máximo 5 km/h y detener el tren frente al letrero NO PASAR.");
                }
                if (!estadoActual.n9_aperturaKloanComandada) errores.push("• PASO 12 OMITIDO: Faltó comandar la apertura de puertas con KLOAN (y KAAIZQ si correspondía).");
                if (!estadoActual.n9_klvrNormalizado || !estadoActual.n9_kihksaNormalizado) {
                    errores.push("• PASO 13 INCORRECTO: Faltó normalizar KLVR y K.IH.KSA en cabina antes de salir a salón.");
                }
                if (!estadoActual.n9_dduPreSalidaVerificada) errores.push("• PASO 14 OMITIDO: Faltó verificar nuevamente en DDU la o las puertas donde está accionado el K.SA.");
                if (!estadoActual.n9_rearmeKsaAntihorario) {
                    errores.push("• PASOS 15 y 16 INCORRECTOS: Faltó acudir al salón equipado y rearmar KSA introduciendo llave triangular y girando suavemente en sentido ANTIHORARIO 1/4 de vuelta.");
                }
                if (!estadoActual.n9_pccInformeFinalMotivo) {
                    errores.push("• PASO 18 OMITIDO: Faltó informar a PCC del motivo del accionamiento del K.S.A para continuar rodado.");
                }
            } else if (nivelActual === 2) {
                if (!estadoActual.informoPasajerosDetencion) errores.push("• Nivel 2: Faltó informar detención.");
                if (!estadoActual.comunicadoPCC_Final) errores.push("• Nivel 2: Faltó comunicación final PCC.");
            } else if (nivelActual === 3) {
                if (!estadoActual.llaveTriangularGiradaHorario) errores.push("• Nivel 3: Faltó accionamiento llave triangular.");
            }

            let msg = errores.length === 0 ? 
                "🟢 EVALUACIÓN: APROBADO (100%)\nProcedimiento normativo ejecutado con estricto apego a los 18 pasos oficiales de Metro." : 
                "🔴 EVALUACIÓN: REPROBADO\nSe detectaron los siguientes desvíos normativos:\n\n" + errores.join("\n");
            
            actualizarPanel("EVALUACIÓN DEL PROCEDIMIENTO", msg);
        }

        window.onload = () => { 
            inicializarSimulador(); 
            setTimeout(() => { imageMapResize(); }, 200);
        };
        window.onresize = () => { imageMapResize(); };
    </script>
</body>
</html>
